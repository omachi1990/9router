name = "9router"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[alias]
"@/lib/usageDb.js" = "./src/stubs/usageDb.js"
"../../src/shared/utils/machineId.js" = "./src/stubs/machineId.js"
"../../src/shared/utils/clineAuth.js" = "./src/stubs/clineAuth.js"
"uuid" = "./node_modules/uuid/dist/index.js"
"undici" = "./src/stubs/undici.js"

[[kv_namespaces]]
binding = "KV"

[[d1_databases]]
binding = "DB"
database_name = "proxy-db"
